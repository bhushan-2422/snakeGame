<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sarpa-Mitra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body">
        <div class="buttons">
            <div class="levels">
                <div class="easy level" id="easy">Easy</div>
                <div class="medium level">Medium</div>
                <div class="hard level">Hard</div>
            </div>
            <div class="music">Music</div>

        </div>
        
        <div class="board" id="board"></div>
        <div class="scoreboard">
            <div id="score">score: 0</div>
            <div id="highscoreBox">High score : 0</div>
        </div>
        
    </div>
    <div class="controls">
        <div class="up-down">
            <div id="top" class="ctrlbtn"> ↑ </div>
            <div id="bottom" class="ctrlbtn"> ↓ </div>
        </div>
        
        <div class="left-right">
            <div id="left" class="ctrlbtn"> ← </div>
            <div id="right" class="ctrlbtn"> → </div>
        </div>




    </div>
    

    <script src="index.js"></script>
    
</body>
</html>
